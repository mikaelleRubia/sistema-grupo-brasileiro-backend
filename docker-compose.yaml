version: '3'
services:
  api:
    image: mikaelle2rubia/sistemagrup
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: "grupobrasileirodeploy"
    ports:
     - "5432:5432"
